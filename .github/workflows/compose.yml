name: Standard app composition
run-name: >-
  ${{ inputs.recovery_marker &&
      format('Compose recovery {0} {1} {2} {3}', inputs.recovery_marker, inputs.expected_core_version,
        inputs.expected_core_sha, inputs.expected_core_wheel_sha256) || 'Standard app composition' }}
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      core_wheel:
        description: Optional official SDK wheel URL; leave both inputs empty to select automatically
        required: false
        type: string
      version:
        description: Optional SDK version paired with the wheel URL
        required: false
        type: string
      recovery_marker:
        description: Recovery marker from the failed composition receipt
        type: string
      expected_plugins_sha:
        description: Exact protected Plugins commit from the receipt
        type: string
      expected_core_version:
        description: Exact Core version from the receipt
        type: string
      expected_core_sha:
        description: Exact Core release-tag commit from the receipt
        type: string
      expected_core_wheel_sha256:
        description: Exact Core wheel digest from the receipt
        type: string
      dependency_pins:
        description: Canonical JSON with the verified dependency tag revisions and asset hashes
        type: string
permissions: {}
concurrency:
  group: standard-app-${{ github.repository }}
  cancel-in-progress: false
jobs:
  select:
    if: github.event_name == 'workflow_dispatch' || github.repository == 'helmut-hoffer-von-ankershoffen/heinzel-plugins'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.next.outputs.version }}
      core_wheel: ${{ steps.next.outputs.core_wheel }}
      finalize: ${{ steps.next.outputs.finalize }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - id: next
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CORE_URL: ${{ inputs.core_wheel }}
          VERSION: ${{ inputs.version }}
          RECOVERY_MARKER: ${{ inputs.recovery_marker }}
          EXPECTED_PLUGINS_SHA: ${{ inputs.expected_plugins_sha }}
          EXPECTED_CORE_VERSION: ${{ inputs.expected_core_version }}
          EXPECTED_CORE_SHA: ${{ inputs.expected_core_sha }}
          EXPECTED_CORE_WHEEL_SHA256: ${{ inputs.expected_core_wheel_sha256 }}
          DEPENDENCY_PINS: ${{ inputs.dependency_pins }}
        run: uv run --frozen --no-build --group tooling python scripts/next_app.py
  compose:
    needs: select
    if: needs.select.outputs.version != ''
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Check enrolled plugin publications
        id: dependencies
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CORE_URL: ${{ needs.select.outputs.core_wheel }}
          VERSION: ${{ needs.select.outputs.version }}
          EXPECTED_CORE_SHA: ${{ inputs.expected_core_sha }}
          EXPECTED_CORE_WHEEL_SHA256: ${{ inputs.expected_core_wheel_sha256 }}
          DEPENDENCY_PINS: ${{ inputs.dependency_pins }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          uv run --frozen --no-build --group tooling python scripts/compose.py --core-url "$CORE_URL" --version "$VERSION" --dependency-check
      - name: Upload enrolled plugin dependency evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.dependencies.outputs.dependency_missing == 'true'
        with:
          name: standard-app-dependency
          path: ${{ runner.temp }}/standard-app-dependency.json
          if-no-files-found: error
      - name: Build and verify the locally enrolled standard profile
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CORE_URL: ${{ needs.select.outputs.core_wheel }}
          VERSION: ${{ needs.select.outputs.version }}
          EXPECTED_CORE_SHA: ${{ inputs.expected_core_sha }}
          EXPECTED_CORE_WHEEL_SHA256: ${{ inputs.expected_core_wheel_sha256 }}
          DEPENDENCY_PINS: ${{ inputs.dependency_pins }}
        run: |
          BROWSER_PROFILE=standard uv run --frozen --no-build --group tooling python scripts/browser_dependencies.py
          uv run --frozen --no-build --group tooling python scripts/compose.py --core-url "$CORE_URL" --version "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standard-app
          path: dist/standard/*
  publish:
    needs: [select, compose]
    runs-on: ubuntu-latest
    environment: standard-app
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: standard-app
          path: dist
      - name: Publish the approved immutable app profile
        env:
          VERSION: ${{ needs.select.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          uv run --frozen --no-build --group tooling python scripts/release_notes.py app "$VERSION" --profile dist/standard.json > "$RUNNER_TEMP/release-notes.md"
          released="$(gh release view "v$VERSION" --repo helmut-hoffer-von-ankershoffen/heinzel --json isPrerelease --jq .isPrerelease 2>/dev/null || echo true)"
          if [ "$released" = false ] && [[ "$VERSION" != *dev* ]]; then
            uv run --frozen --no-build --group tooling python scripts/publish.py --tag "app-v$VERSION" --revision "$REVISION" --directory dist --make-latest true --notes-file "$RUNNER_TEMP/release-notes.md"
          else # an edge or held app is a pre-release: the default install paths can never select it
            uv run --frozen --no-build --group tooling python scripts/publish.py --tag "app-v$VERSION" --revision "$REVISION" --directory dist --make-latest false --prerelease --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
  finalize:
    needs: select
    if: needs.select.outputs.finalize != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: standard-app
    permissions:
      contents: write
    steps:
      - name: Make the accepted held app the latest, now that its core is on PyPI
        env:
          VERSION: ${{ needs.select.outputs.finalize }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "app-v$VERSION" --prerelease=false --latest
