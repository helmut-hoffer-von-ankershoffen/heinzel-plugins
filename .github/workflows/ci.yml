# Branch-only copy of the registered workflow for a single diagnostic.
name: Plugins presentation transport comparison
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full SHA of the independently reviewed diagnostic commit
        required: true
        type: string
permissions: {}
jobs:
  presentation-diagnostic:
    name: Presentation transport comparison only
    if: >-
      github.repository == 'helmut-hoffer-von-ankershoffen/heinzel-plugins' &&
      github.ref == 'refs/heads/validation/plugins-presentation-pair'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require the reviewed revision
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: |
          if [ "$REVIEWED_SHA" != "$GITHUB_SHA" ]; then
            echo "The dispatch ref does not match the reviewed revision."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14.4"
          enable-cache: false
      - name: Require and record the runner image
        shell: bash
        run: |
          os_version="$(awk -F= '$1 == "VERSION_ID" { gsub(/"/, "", $2); print $2 }' /etc/os-release)"
          if ! [[ "$os_version" == 26.04 && "${ImageOS:-}" =~ ^ubuntu[0-9]+$ && "${ImageVersion:-}" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo 'Runner image metadata is unavailable or unexpected.' >&2
            exit 1
          fi
          printf 'runner_os=ubuntu-%s runner_image=%s runner_image_version=%s\n' "$os_version" "$ImageOS" "$ImageVersion"
      - name: Compare pipe and file capture under coverage
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          timeout --kill-after=5s 150s \
            uv run --quiet --frozen --no-build --group tooling --extra checks python scripts/presentation_pair.py
