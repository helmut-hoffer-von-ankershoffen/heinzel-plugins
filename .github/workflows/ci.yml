name: Plugin CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      core_artifact:
        description: Immutable candidate core wheel URL (empty uses each declared released version)
        type: string
      core_run:
        description: Official core Actions run ID providing a candidate built wheel
        type: string
permissions: {}
concurrency:
  group: plugins-${{ github.ref }}
  cancel-in-progress: true
jobs:
  coverage:
    name: Tooling coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      uncovered: ${{ steps.uncovered.outputs.files }} # the Coverage floor job names them in its verdict
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
      - name: Measure the shared developer toolkit
        run: uv run --frozen --no-build --group tooling --extra checks coverage run -m pytest tests -q
      - name: Record the total for the Coverage floor job
        run: uv run --frozen --no-build --group tooling --extra checks coverage report --format=total --precision=2 > coverage-total.txt
      - id: uncovered
        name: Name the least covered files for the Coverage floor verdict
        run: |
          uv run --frozen --no-build --group tooling --extra checks coverage report --sort=-miss --skip-covered --skip-empty --show-missing > coverage-files.txt || true
          { echo 'files<<COVERAGE_EOF'; sed -n '3,14p' coverage-files.txt | grep -v '^-' | cut -c1-300 || true; echo 'COVERAGE_EOF'; } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-total
          path: coverage-total.txt
          retention-days: 7
      - name: Publish coverage badge and PR report
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: py-cov-action/python-coverage-comment-action@e5fb2218463c3377f3504b0c5b5646ed53da7a2f # v4.5
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 80
  policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Preserve commit, title, branch and confidentiality checks
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHECK_TITLE: ${{ github.event.pull_request.title }}
          CHECK_BRANCH: ${{ github.head_ref || github.ref_name }}
          CONFIDENTIAL_TERMS: ${{ secrets.CONFIDENTIAL_TERMS }}
          CONFIDENTIALITY_REQUIRED: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
        run: make policies
      - name: Scan the complete source history for credentials
        run: make secrets
  plan:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      selected: ${{ steps.plan.outputs.selected }}
      tooling: ${{ steps.plan.outputs.tooling }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: make tooling-check
      - id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE" 2>/dev/null; then
            uv run --frozen --no-build --group tooling python scripts/plugins.py plan --base "$BASE" > plan.json
          else
            uv run --frozen --no-build --group tooling python scripts/plugins.py plan --changed scripts/plugins.py > plan.json
          fi
          matrix="$(python -c 'import json; print(json.dumps({"include":json.load(open("plan.json"))["include"]}))')"
          {
            echo "matrix=$matrix"
            echo "selected=$(python -c 'import json; print(bool(json.load(open("plan.json"))["include"]))')"
            echo "tooling=$(python -c 'import json; print(json.load(open("plan.json"))["tooling"])')"
          } >> "$GITHUB_OUTPUT"
          cat plan.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: work-plan
          path: plan.json
  screenshots:
    needs: plan
    if: needs.plan.outputs.tooling == 'True'
    name: Screenshot author journey
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install the capture browser and its runner libraries
        run: uv run --frozen --with playwright==1.64.1 --group tooling playwright install --with-deps chromium
      - name: Capture a new unknown plugin, detect staleness, fail a scene and recover
        env:
          HZ_CAPTURE_E2E: '1'
        run: uv run --frozen --with playwright==1.64.1 --group tooling pytest tests/capture_e2e_test.py -q
  plugin:
    permissions:
      contents: read
      actions: read
    needs: plan
    if: needs.plan.outputs.selected == 'True'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLUGIN_PRIVATE: ${{ github.event.repository.private }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - id: core
        env:
          CORE_URL: ${{ inputs.core_artifact || vars.CORE_ARTIFACT }}
          CORE_RUN: ${{ inputs.core_run || vars.CORE_CANDIDATE_RUN }}
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen --no-build --group tooling python scripts/core_artifact.py
      - name: Check only this plugin against the installed core artifact
        env:
          PLUGIN: ${{ matrix.name }}
          CORE: ${{ steps.core.outputs.wheel }}
          CONFIDENTIAL_TERMS: ${{ secrets.CONFIDENTIAL_TERMS }}
          CONFIDENTIALITY_REQUIRED: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
        run: make check NAME="$PLUGIN" CORE="$CORE"
      - name: Audit the owning runtime dependency closure
        env:
          PLUGIN: ${{ matrix.name }}
          CORE: ${{ steps.core.outputs.wheel }}
        run: make audit NAME="$PLUGIN" CORE="$CORE"
      - name: Build only this plugin
        env:
          PLUGIN: ${{ matrix.name }}
        run: make build NAME="$PLUGIN"
      - name: Install declared browser runner libraries from the owning lock
        env:
          PLUGIN: ${{ matrix.name }}
        run: uv run --frozen --no-build --group tooling python scripts/browser_dependencies.py
      # Issues' e2e tests run the real Beads CLI; a pinned, checksummed release makes them run (and required) here.
      - name: Install the pinned Beads CLI for heinzel-issues
        if: matrix.name == 'heinzel-issues'
        env:
          BD_VERSION: 1.3.4
          BD_SHA256: 175c26904bde3ff9168d2282ff6b56f17b17f60c22fa5acb3dacc9fb3465303a
        run: |
          archive="beads_${BD_VERSION}_linux_amd64.tar.gz"
          curl --proto "=https" --proto-redir "=https" -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/gastownhall/beads/releases/download/v${BD_VERSION}/$archive"
          echo "$BD_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bd"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bd" bd
          echo "$RUNNER_TEMP/bd" >> "$GITHUB_PATH"
          echo "HZ_ISSUES_REQUIRE_BD=1" >> "$GITHUB_ENV"
      - name: Test the installed owning wheel in the browser when declared
        env:
          PLUGIN: ${{ matrix.name }}
          DIRECTORY: ${{ matrix.path }}
          CORE: ${{ steps.core.outputs.wheel }}
        run: |
          if [ -d "$DIRECTORY/tests/browser" ] || [ -d "$DIRECTORY/tests/acceptance" ] || [ -d "$DIRECTORY/tests/e2e" ]; then make acceptance NAME="$PLUGIN" CORE="$CORE"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.path }}/dist/*
  # The coverage floor, judged inside this run (scripts/coverage_floor.py): the run tests the pull request's merge
  # commit, so there is no stale tested base and no separate check. Its verdict names measured vs required percent,
  # the scope and the least covered files; a broken judge says TOOL ERROR. CI OK requires it.
  coverage-floor:
    name: Coverage floor
    if: ${{ !cancelled() }}
    needs: [coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.judge.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the total this run's Tooling coverage job measured
        if: needs.coverage.result == 'success' || needs.coverage.result == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-total
          path: ${{ runner.temp }}/coverage-total
      - id: judge
        name: Judge the coverage floor of this run's merge commit
        if: ${{ !cancelled() }} # also after a failed download: the judge names a missing total
        env:
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          COVERAGE_TOTAL: ${{ runner.temp }}/coverage-total/coverage-total.txt
          UNCOVERED: ${{ needs.coverage.outputs.uncovered }}
        run: python3 -I scripts/coverage_floor.py
  # Sonar's overall-code ratings (scripts/sonar_ratings.py): the SonarCloud check judges new code; this keeps
  # reliability, security and maintainability of the whole project at A. CI OK requires it on pull requests.
  sonar-ratings:
    name: Sonar ratings
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.judge.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: judge
        name: Overall reliability, security and maintainability are rated A
        run: python3 -I scripts/sonar_ratings.py
  # The gate guard (scripts/gate_guard.py, main's copy): a pull request that changes the coverage, floor, Sonar or
  # CI OK jobs, their scripts or pyproject's coverage and pytest sections needs the owner's label gate-change-approved.
  gate-guard:
    name: Gate guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the pull request's labels
      issues: read # who added the label, and when
      actions: read # when this run started
    outputs:
      verdict: ${{ steps.judge.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: judge
        name: Guarded gate inputs are unchanged, or the owner approved the change
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # the base is the test merge's first parent: main as it is merged into, not the PR's older base
          BASE_SHA="$(git rev-parse HEAD^1)"
          export BASE_SHA
          # main's copy judges, so a pull request can't loosen the guard that judges it; a first guard runs its own
          if git cat-file -e "$BASE_SHA:scripts/gate_guard.py" 2>/dev/null; then
            git show "$BASE_SHA:scripts/gate_guard.py" > "$RUNNER_TEMP/gate_guard.py"
          else
            cp scripts/gate_guard.py "$RUNNER_TEMP/gate_guard.py"
          fi
          python3 -I "$RUNNER_TEMP/gate_guard.py"
  gallery:
    # The local digest covers only UI inputs; this re-capture against the newest compatible released Core catches text
    # that comes from plugin Python, metadata or Core. Deterministic (Playwright, fixtures), no agent.
    # Promote this to CI OK after the refreshed gallery has been verified on the hosted Linux runners.
    name: Screenshot gallery re-capture
    permissions:
      contents: read
    needs: plan
    if: needs.plan.outputs.selected == 'True'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Install the capture browser and its runner libraries
        if: hashFiles(format('{0}/docs/screenshot-definition.json', matrix.path)) != ''
        run: uv run --frozen --with playwright==1.64.1 --group tooling playwright install --with-deps chromium
      - name: Re-capture against released Core and compare every scene's text with the committed gallery
        if: hashFiles(format('{0}/docs/screenshot-definition.json', matrix.path)) != ''
        env:
          PLUGIN: ${{ matrix.name }}
          CONFIDENTIAL_TERMS: ${{ secrets.CONFIDENTIAL_TERMS }}
          CONFIDENTIALITY_REQUIRED: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
        run: make screenshots-verify NAME="$PLUGIN"
  ok:
    name: CI OK
    if: always()
    needs: [policy, plan, plugin, coverage, coverage-floor, sonar-ratings, gate-guard, screenshots]
    runs-on: ubuntu-latest
    steps:
      - env:
          POLICY: ${{ needs.policy.result }}
          PLAN: ${{ needs.plan.result }}
          PLUGIN: ${{ needs.plugin.result }}
          COVERAGE: ${{ needs.coverage.result }}
          FLOOR: ${{ needs.coverage-floor.result }}
          FLOOR_VERDICT: ${{ needs.coverage-floor.outputs.verdict }}
          SONAR: ${{ needs.sonar-ratings.result }}
          SONAR_VERDICT: ${{ needs.sonar-ratings.outputs.verdict }}
          GUARD: ${{ needs.gate-guard.result }}
          GUARD_VERDICT: ${{ needs.gate-guard.outputs.verdict }}
          EVENT: ${{ github.event_name }}
          SCREENSHOTS: ${{ needs.screenshots.result }}
        run: |
          if [ "$FLOOR" != success ]; then echo "::error::Coverage floor ended with ${FLOOR:-no result}: ${FLOOR_VERDICT:-no verdict}"; fi
          # Sonar ratings and the gate guard judge pull requests; a push to main or a dispatch skips them
          pr_only() { test "$1" = success || { test "$1" = skipped && test "$EVENT" != pull_request; }; }
          pr_only "$SONAR" || echo "::error::Sonar ratings ended with ${SONAR:-no result}: ${SONAR_VERDICT:-no verdict}"
          pr_only "$GUARD" || echo "::error::Gate guard ended with ${GUARD:-no result}: ${GUARD_VERDICT:-no verdict}"
          pr_only "$SONAR" && pr_only "$GUARD" && test "$POLICY" = success && test "$PLAN" = success && test "$COVERAGE" = success && test "$FLOOR" = success && { test "$SCREENSHOTS" = success || test "$SCREENSHOTS" = skipped; } && { test "$PLUGIN" = success || test "$PLUGIN" = skipped; }
