name: Plugin CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      core_artifact:
        description: Immutable candidate core wheel URL (empty uses each declared released version)
        type: string
      core_run:
        description: Official core Actions run ID providing a candidate built wheel
        type: string
permissions: {}
concurrency:
  group: plugins-${{ github.ref }}
  cancel-in-progress: true
jobs:
  coverage:
    name: Tooling coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
      - name: Measure the shared developer toolkit
        env:
          CONFIDENTIALITY_REQUIRED: 'false' # fictional fixtures only; the guard's CI requirement has its own tests
        run: uv run --frozen --no-build --group tooling --extra checks coverage run -m pytest tests -q
      - name: Record the total for the merge gate
        run: uv run --frozen --no-build --group tooling --extra checks coverage report --format=total --precision=2 > coverage-total.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-total
          path: coverage-total.txt
          retention-days: 7
      - name: Publish coverage badge and PR report
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: py-cov-action/python-coverage-comment-action@e5fb2218463c3377f3504b0c5b5646ed53da7a2f # v4.5
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 80
  policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Preserve commit, title, branch and confidentiality checks
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHECK_TITLE: ${{ github.event.pull_request.title }}
          CHECK_BRANCH: ${{ github.head_ref || github.ref_name }}
          CONFIDENTIAL_TERMS: ${{ secrets.CONFIDENTIAL_TERMS }}
          CONFIDENTIALITY_REQUIRED: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
        run: make policies
      - name: Scan the complete source history for credentials
        run: make secrets
  plan:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      selected: ${{ steps.plan.outputs.selected }}
      tooling: ${{ steps.plan.outputs.tooling }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: make tooling-check
      - id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE" 2>/dev/null; then
            uv run --frozen --no-build --group tooling python scripts/plugins.py plan --base "$BASE" > plan.json
          else
            uv run --frozen --no-build --group tooling python scripts/plugins.py plan --changed scripts/plugins.py > plan.json
          fi
          matrix="$(python -c 'import json; print(json.dumps({"include":json.load(open("plan.json"))["include"]}))')"
          {
            echo "matrix=$matrix"
            echo "selected=$(python -c 'import json; print(bool(json.load(open("plan.json"))["include"]))')"
            echo "tooling=$(python -c 'import json; print(json.load(open("plan.json"))["tooling"])')"
          } >> "$GITHUB_OUTPUT"
          cat plan.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: work-plan
          path: plan.json
  screenshots:
    needs: plan
    if: needs.plan.outputs.tooling == 'True'
    name: Screenshot author journey
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install the capture browser and its runner libraries
        run: uv run --frozen --with playwright==1.64.1 --group tooling playwright install --with-deps chromium
      - name: Capture a new unknown plugin, detect staleness, fail a scene and recover
        env:
          HZ_CAPTURE_E2E: '1'
          CONFIDENTIALITY_REQUIRED: 'false' # a synthetic fictional plugin
        run: uv run --frozen --with playwright==1.64.1 --group tooling pytest tests/capture_e2e_test.py -q
  plugin:
    permissions:
      contents: read
      actions: read
    needs: plan
    if: needs.plan.outputs.selected == 'True'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLUGIN_PRIVATE: ${{ github.event.repository.private }}
      # The screenshot guards scan for the confidential terms; without them they fail here instead of scanning none.
      CONFIDENTIAL_TERMS: ${{ secrets.CONFIDENTIAL_TERMS }}
      CONFIDENTIALITY_REQUIRED: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - id: core
        env:
          CORE_URL: ${{ inputs.core_artifact || vars.CORE_ARTIFACT }}
          CORE_RUN: ${{ inputs.core_run || vars.CORE_CANDIDATE_RUN }}
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen --no-build --group tooling python scripts/core_artifact.py
      - name: Check only this plugin against the installed core artifact
        env:
          PLUGIN: ${{ matrix.name }}
          CORE: ${{ steps.core.outputs.wheel }}
        run: make check NAME="$PLUGIN" CORE="$CORE"
      - name: Audit the owning runtime dependency closure
        env:
          PLUGIN: ${{ matrix.name }}
          CORE: ${{ steps.core.outputs.wheel }}
        run: make audit NAME="$PLUGIN" CORE="$CORE"
      - name: Build only this plugin
        env:
          PLUGIN: ${{ matrix.name }}
        run: make build NAME="$PLUGIN"
      - name: Install declared browser runner libraries from the owning lock
        env:
          PLUGIN: ${{ matrix.name }}
        run: uv run --frozen --no-build --group tooling python scripts/browser_dependencies.py
      # Issues' e2e tests run the real Beads CLI; a pinned, checksummed release makes them run (and required) here.
      - name: Install the pinned Beads CLI for heinzel-issues
        if: matrix.name == 'heinzel-issues'
        env:
          BD_VERSION: 1.3.4
          BD_SHA256: 175c26904bde3ff9168d2282ff6b56f17b17f60c22fa5acb3dacc9fb3465303a
        run: |
          archive="beads_${BD_VERSION}_linux_amd64.tar.gz"
          curl --proto "=https" --proto-redir "=https" -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/gastownhall/beads/releases/download/v${BD_VERSION}/$archive"
          echo "$BD_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bd"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bd" bd
          echo "$RUNNER_TEMP/bd" >> "$GITHUB_PATH"
          echo "HZ_ISSUES_REQUIRE_BD=1" >> "$GITHUB_ENV"
      - name: Test the installed owning wheel in the browser when declared
        env:
          PLUGIN: ${{ matrix.name }}
          DIRECTORY: ${{ matrix.path }}
          CORE: ${{ steps.core.outputs.wheel }}
        run: |
          if [ -d "$DIRECTORY/tests/browser" ] || [ -d "$DIRECTORY/tests/acceptance" ] || [ -d "$DIRECTORY/tests/e2e" ]; then make acceptance NAME="$PLUGIN" CORE="$CORE"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.path }}/dist/*
  gallery:
    # The local digest covers only UI inputs; this re-capture against the plugin's locked Core catches displayed text
    # that comes from plugin Python, metadata or Core. Deterministic (Playwright, fixtures), no agent.
    # Not yet required by CI OK: the committed galleries predate Core 0.9.54 (its first-Heinzel panel covers the
    # captures; the slack and google definitions no longer run). It turns required once those are fixed.
    name: Screenshot gallery re-capture
    permissions:
      contents: read
    needs: plan
    if: needs.plan.outputs.selected == 'True'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONFIDENTIAL_TERMS: ${{ secrets.CONFIDENTIAL_TERMS }}
      CONFIDENTIALITY_REQUIRED: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Re-capture against the locked Core and compare every scene's text with the committed gallery
        if: hashFiles(format('{0}/docs/screenshot-definition.json', matrix.path)) != ''
        env:
          PLUGIN: ${{ matrix.name }}
        run: |
          uv run --frozen --with playwright==1.64.1 --group tooling playwright install --with-deps chromium
          make screenshots-verify NAME="$PLUGIN"
  ok:
    name: CI OK
    if: always()
    needs: [policy, plan, plugin, coverage, screenshots]
    runs-on: ubuntu-latest
    steps:
      - env:
          POLICY: ${{ needs.policy.result }}
          PLAN: ${{ needs.plan.result }}
          PLUGIN: ${{ needs.plugin.result }}
          COVERAGE: ${{ needs.coverage.result }}
          SCREENSHOTS: ${{ needs.screenshots.result }}
        run: test "$POLICY" = success && test "$PLAN" = success && test "$COVERAGE" = success && { test "$SCREENSHOTS" = success || test "$SCREENSHOTS" = skipped; } && { test "$PLUGIN" = success || test "$PLUGIN" = skipped; }
