name: Release bumped plugins

# After a green main, release every plugin whose version has no tag yet and is not on PyPI yet, so a version bump is
# published when it merges and app composition never finds a version that was never released (ADR 0114; owner decision
# 2026-11-22: CI publishes on merge). Each release goes through the reviewed Release one plugin workflow (trusted
# publishing); a plugin whose release is already running is skipped, so a release is never dispatched twice.

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] the job admits only a green push to this repository's main
    workflows: [Plugin CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write # dispatch the reviewed release workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A workflow_run checks out the default branch's tip, never the triggering ref, and runs only when that tip is
      # the commit that just went green. Release one plugin builds main's tip too, so both see the same commit. If main
      # has moved on, the newer commit's own green run releases what is still untagged.
      - name: Dispatch a release for each version not released yet
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          plugins="$(python3 scripts/plugin_versions.py unreleased --skip-published)"
          if [ -z "$plugins" ]; then
            echo "Every plugin version is released."
            exit 0
          fi
          active="$(gh run list --workflow release.yml --limit 100 --json status,displayTitle \
            --jq '.[] | select(.status != "completed") | .displayTitle')"
          while read -r plugin; do
            if grep -qxF "Release $plugin" <<< "$active"; then
              echo "A release of $plugin is running already."
              continue
            fi
            gh workflow run release.yml --ref main -f plugin="$plugin" -f publish=true
          done <<< "$plugins"
