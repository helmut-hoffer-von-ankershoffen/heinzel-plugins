name: Release bumped plugins

# After a green main, release every plugin whose version has no tag yet and is not on PyPI yet, so a version bump is
# published when it merges and app composition never finds a version that was never released (ADR 0114; owner decision
# 2026-11-22: CI publishes on merge). Each release goes through the reviewed Release one plugin workflow (trusted
# publishing). Publishers serialize on the verified version tag.

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] the job admits only a green push to this repository's main
    workflows: [Plugin CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write # dispatch the reviewed release workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A workflow_run checks out the default branch's tip, never the triggering ref, and runs only when that tip is
      # the commit that just went green. Release one plugin builds main's tip too, so both see the same commit. If main
      # has moved on, the newer commit's own green run releases what is still untagged.
      - name: Dispatch a release for each version not released yet
        env:
          GREEN_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          plugins="$(python3 scripts/plugin_versions.py unreleased --skip-published --tags)"
          if [ -z "$plugins" ]; then
            echo "Every plugin version is released."
            exit 0
          fi
          while read -r tag; do
            recovery=()
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              revision="$(git rev-parse --verify "refs/tags/$tag^{commit}")"
              git merge-base --is-ancestor "$revision" "$GREEN_SHA"
              recovery=(-f resume_tag="$tag" -f expected_tag_revision="$revision")
            fi
            gh workflow run release.yml --ref main -f plugin="${tag%/v*}" -f publish=true -f expected_sha="$GREEN_SHA" -f expected_tag="$tag" "${recovery[@]}"
          done <<< "$plugins"
