[[scenes]]
name = "launch-files-json"
surface = "cli"
caption = "Use the Google files operation's structured output with fictional files from the local fixture."
command = ["google", "files", "--days", "3", "--name", "Launch", "--json"]

[[scenes]]
name = "launch-metrics"
surface = "cli"
caption = "Read fictional launch metrics as a table through the documents adapter and fixture-only requester."
command = ["showcase", "notes", "launch-metrics"]

[[scenes]]
name = "mail-content"
surface = "cli"
caption = "Read a fictional launch message through the Gmail adapter and fixture-only requester."
command = ["showcase", "message-content"]
