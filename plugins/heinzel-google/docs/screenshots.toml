format = 1
bootstrap = "docs/screenshot_fixture.py"

[[scenes]]
name = "launch-files"
surface = "ui"
route = "/"
caption = "Find fictional launch files from the last three days in the app terminal; replies come from the local fixture."
timeout_ms = 30000

[[scenes.steps]]
action = "terminal"
command = ["google", "files", "--days", "3", "--name", "Launch"]

[scenes.viewport]
width = 1280
height = 650

[[scenes]]
name = "launch-files-week"
surface = "ui"
route = "/"
caption = "Try seven days without a name filter; the local fixture returns the same fictional files for both searches."
timeout_ms = 30000

[[scenes.steps]]
action = "terminal"
command = ["google", "files", "--days", "7"]

[scenes.viewport]
width = 1280
height = 650

[[scenes]]
name = "launch-plan"
surface = "ui"
route = "/"
caption = "Read a fictional launch plan through the documents adapter using the fixture-only requester."
timeout_ms = 30000

[[scenes.steps]]
action = "terminal"
command = ["showcase", "notes", "launch-plan"]

[scenes.viewport]
width = 1280
height = 650

[[scenes]]
name = "launch-week"
