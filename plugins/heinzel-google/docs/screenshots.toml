format = 1
bootstrap = "docs/screenshot_fixture.py"
browser_time = "2026-10-22T12:00:00Z"

[[scenes]]
name = "recent-files"
surface = "ui"
route = "/"
caption = "Start with a seven-day file scan — fictional Docs and Sheets, real Google files operation in the app terminal"
timeout_ms = 30000

[[scenes.steps]]
action = "terminal"
command = ["google", "files", "--days", "7"]

[scenes.viewport]
width = 1280
height = 650

