format = 1
bootstrap = "docs/screenshot_fixture.py"

[[scenes]]
name = "google-upcoming-review"
surface = "ui"
route = "/"
appearance = "dark"
caption = "A fictional launch review shows as the next meeting in the footer calendar summary, read through the Google calendar adapter."
timeout_ms = 30000
viewport = { width = 1280, height = 900 }

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "^Calendar: .*Launch readiness review"
within_role = "contentinfo"

[[scenes.steps]]
action = "wait"
text = "Next: Launch readiness review"

[[scenes]]
