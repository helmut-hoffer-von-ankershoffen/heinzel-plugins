format = 1
bootstrap = "docs/screenshot_fixture.py"

[[scenes]]
name = "widget-and-status"
surface = "ui"
route = "/"
caption = "Demo data: the constant 42 appears in both the Today widget and sidebar status."

[[scenes.steps]]
action = "wait"
text = "Example value"

[[scenes.steps]]
action = "wait"
text = "Example: 42"

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "^Dismiss Doctor"
optional = true

[[scenes]]
name = "inspector"
surface = "ui"
route = "/?panel=example:inspector"
caption = "Demo data: open the plugin-owned inspector to see the same constant value, 42."

[[scenes.steps]]
action = "wait"
role = "region"
name = "Example"

[[scenes.steps]]
action = "wait"
text = "The value is 42."

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "^Dismiss Doctor"
optional = true

[[scenes]]
name = "greeting-terminal"
surface = "ui"
route = "/"
caption = "Demo data: greet fictional Mira with structured JSON in the app's native terminal."

[[scenes.steps]]
action = "terminal"
command = ["example", "hello", "--name", "Mira", "--json"]

[[scenes]]
name = "plugin-notice"
surface = "ui"
route = "/"
caption = "Demo data: a seeded Example is ready notice appears in the shared in-app notification panel."

[[scenes.steps]]
action = "wait"
text = "Example value"

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "^Dismiss Doctor"
optional = true

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "^Notifications"

[[scenes.steps]]
action = "wait"
text = "Example is ready"

[scenes.viewport]
width = 1280
height = 650

[[scenes]]
name = "greeting-cli"
surface = "cli"
caption = "Demo data: the typed hello operation greets fictional Mira from the CLI."
command = ["example", "hello", "--name", "Mira"]

[[scenes]]
name = "sample-json"
surface = "cli"
caption = "Demo data: sample returns 42 as JSON, the same constant used by the widget, status and inspector."
command = ["example", "sample", "--json"]
