format = 1
bootstrap = "docs/screenshot_fixture.py"
browser_time = "2026-11-01T00:00:00Z"

[[scenes]]
name = "workflow-collection"
surface = "ui"
route = "/contracts"
appearance = "light"
caption = "Explore the fictional weekly code review in the local workflow collection"
timeout_ms = 30000

[[scenes.steps]]
action = "hover"
role = "link"
name = "Weekly code review"
within_role = "main"

[[scenes.steps]]
action = "wait"
text = "Weekly code review"

[scenes.viewport]
width = 1440
height = 960

[[scenes]]
name = "workflow-context"
surface = "ui"
route = "/contracts/weekly-code-review"
appearance = "dark"
caption = "Fictional weekly review declares merged-work and issue inputs; no report was generated"
timeout_ms = 30000

[[scenes.steps]]
action = "wait"
role = "heading"
name = "Weekly code review"

[scenes.viewport]
width = 1280
height = 800

[[scenes]]
name = "merged-work"
surface = "ui"
route = "/"
appearance = "light"
caption = "Fictional merged pull requests in the app terminal, using a fixture-only requester and the real adapter"
timeout_ms = 30000

[[scenes.steps]]
action = "terminal"
command = ["showcase", "merged", "acme/widgets"]

[scenes.viewport]
width = 1280
height = 650

[[scenes]]
name = "issue-changes"
surface = "ui"
route = "/"
appearance = "dark"
caption = "Fictional issue changes, owners and states in the app terminal, using a fixture-only requester"
timeout_ms = 30000

[[scenes.steps]]
action = "terminal"
command = ["showcase", "issues", "acme/widgets"]

[scenes.viewport]
width = 1280
height = 650

[[scenes]]
name = "merged-cli"
surface = "cli"
caption = "Read fictional merged work in the shell with a fixture-only requester and the real adapter"
command = ["showcase", "merged", "acme/widgets"]

[[scenes]]
name = "issues-json"
surface = "cli"
caption = "Fictional issue results as JSON for scripts and agents, using a fixture-only requester"
command = ["showcase", "issues", "acme/widgets", "--json"]
