format = 1
bootstrap = "docs/screenshot_fixture.py"
browser_time = "2026-11-01T00:00:00Z"

# Six existing scenes retained.
# showcase is supplied only by docs/screenshot_fixture.py.
# The native terminal includes uppercase/table and lowercase/JSON issue cases.

[[scenes]]
name = "jira-issues"
surface = "ui"
route = "/"
caption = "Demo data: fictional Jira changes, owners and states in the app terminal, using the real adapter and a fixture-only requester."
timeout_ms = 30000

[scenes.viewport]
width = 1280
height = 650

[[scenes.steps]]
action = "terminal"
command = ["showcase", "issues", "WID"]

[[scenes]]
name = "confluence-plan"
surface = "ui"
route = "/"
caption = "Demo data: read the fictional Widget launch plan with its source and revision, using the real adapter and a fixture-only requester."
timeout_ms = 30000

[scenes.viewport]
width = 1280
height = 650

[[scenes.steps]]
action = "terminal"
command = ["showcase", "page"]

[[scenes]]
name = "issues-json"
surface = "cli"
caption = "Demo data: structured fictional Jira changes through the real adapter, using a fixture-only requester and local vendor replies."
command = ["showcase", "issues", "WID", "--json"]

[[scenes]]
name = "confluence-cli"
surface = "cli"
caption = "Demo data: the fictional Confluence plan, source and revision in the shell, using a fixture-only requester and local vendor replies."
command = ["showcase", "page"]

[[scenes]]
name = "workflow-context"
surface = "ui"
route = "/contracts/weekly-work-review"
caption = "Demo data: the local Weekly work review contract declares Jira and Confluence inputs; no report has been generated."
timeout_ms = 30000

[[scenes.steps]]
action = "wait"
role = "heading"
name = "Weekly work review"

[[scenes]]
name = "jira-parameters"
surface = "ui"
route = "/"
caption = "Demo data: lowercase wid resolves to WID; the fixture requester returns structured Jira changes with --json in the app terminal."
timeout_ms = 30000

[scenes.viewport]
width = 1280
height = 900

[[scenes.steps]]
action = "terminal"
command = ["showcase", "issues", "wid", "--json"]
