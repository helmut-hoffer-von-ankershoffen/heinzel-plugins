[project]
name = "heinzel-slack-capture-fixture"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["heinzel"]

[project.entry-points."heinzel.modules"]
fixturewrite = "fixture_captured_writer"

[project.entry-points."heinzel.connected_sources"]
fixturewrite = "fixture_captured_writer"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fixture_captured_writer"]
