[project]
name = "heinzel-slack"
version = "0.3.0"
description = "Slack for Heinzelmännchen: notices, exact-draft approvals and questions in your own DM, and the chat capability."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/heinzel_slack/_vendor/slack_sdk/LICENSE"]
requires-python = ">=3.12"
dependencies = ["heinzel>=0.9.20,<0.10", "slack-sdk==3.46.0"]

[project.entry-points."heinzel.modules"]
slack = "heinzel_slack"

[project.entry-points."heinzel.connected_sources"]
slack = "heinzel_slack"

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[dependency-groups]
test = ["editables>=0.5", "pytest>=9.0.3,<10", "pytest-timeout>=2.4.0,<3", "ruff==0.17.2", "mypy>=1.19.0,<3", "coverage>=7.12", "pyright[nodejs]==1.1.414"]

[tool.heinzel.plugin]
layout = "collection"
requires = ["core:plugin-api@1"]
provides = ["chat:read", "chat:write"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src"]
pythonVersion = "3.12"

[tool.pytest]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
filterwarnings = ["error"]
markers = ["unit: Isolated behavior.", "integration: Public contracts across layers.", "e2e: Installed artifacts.", "perf: Explicit timing tests.", "long_running: Extended end-to-end budget."]

[tool.coverage.run]
source = ["heinzel_slack"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.hatch.build.targets.wheel]
packages = ["src/heinzel_slack"]

[tool.hatch.build.targets.sdist]
exclude = [".venv", ".acceptance", ".preview", "dist", "**/__pycache__", ".pytest_cache", ".mypy_cache", ".coverage*"]

[tool.heinzel.catalog]
title = "Slack"
category = "connectors"
highlights = [
    "Notices with the reason, in your own Slack direct message",
    "Drafts shared with Approve and Decline, bound to the exact text",
    "Your own private Slack app: no bot shared with anyone, nothing hosted",
    "Questions with options as buttons, and channels read and posted with mentions made inert",
]

[[tool.heinzel.catalog.screenshots]]
path = "docs/assets/screenshots/review-slack-notice.png"
surface = "ui"
caption = "Demo data: Mira reviews the fictional Slack account, destination, scope and complete weekly-report notice before delivery."

[[tool.heinzel.catalog.screenshots]]
path = "docs/assets/screenshots/slack-notice-delivered.png"
surface = "ui"
caption = "Demo data: after Confirm, Core's chat reports that the channel delivered the fictional notice; this does not approve a captured write."

[[tool.heinzel.catalog.screenshots]]
path = "docs/assets/screenshots/slack-draft-cli.png"
surface = "cli"
caption = "Demo data: the fictional weekly-report draft and printed button labels, rendered in the terminal from Slack message blocks."

[[tool.heinzel.catalog.screenshots]]
path = "docs/assets/screenshots/slack-draft-decision-cli.png"
surface = "cli"
caption = "Demo data: fictional clicks exercise the real decision code; Mira's exact approval records one reply while invalid attempts are refused."
