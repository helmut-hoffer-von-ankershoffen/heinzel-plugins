[project]
name = "heinzel-slack"
version = "0.0.0"
description = "Tell the owner what needs them, and ask for approval of an exact draft, in their own Slack DM."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["heinzel>=0.9.8,<0.10", "slack-sdk>=3.33,<4"]

[project.entry-points."heinzel.modules"]
slack = "heinzel_slack"

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[dependency-groups]
test = ["editables>=0.5", "pytest>=9.0.3,<10", "pytest-timeout>=2.4.0,<3", "ruff==0.17.2", "mypy>=1.19.0,<3", "coverage>=7.12", "pyright[nodejs]==1.1.414"]

[tool.heinzel.plugin]
layout = "collection"
requires = ["core:plugin-api@1"]
provides = []

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src"]
pythonVersion = "3.12"

[tool.pytest]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
filterwarnings = ["error"]
markers = ["unit: Isolated behavior.", "integration: Public contracts across layers.", "e2e: Installed artifacts.", "perf: Explicit timing tests.", "long_running: Extended end-to-end budget."]

[tool.coverage.run]
source = ["heinzel_slack"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.hatch.build.targets.wheel]
packages = ["src/heinzel_slack"]

[tool.hatch.build.targets.sdist]
exclude = [".venv", ".acceptance", ".preview", "dist", "**/__pycache__", ".pytest_cache", ".mypy_cache", ".coverage*"]

[tool.heinzel.catalog]
title = "Slack"
category = "connectors"
highlights = [
    "Notices with the reason, in your own Slack direct message",
    "Drafts shared with Approve and Decline, bound to the exact text",
    "Your own private Slack app: no bot shared with anyone, nothing hosted",
]

[[tool.heinzel.catalog.screenshots]]
path = "docs/assets/screenshots/draft-in-slack.png"
surface = "ui"
caption = "Demo data: Lotte's fictional weekly report, rendered from Slack message blocks in the app terminal; printed approval buttons, no Slack connection."

[[tool.heinzel.catalog.screenshots]]
path = "docs/assets/screenshots/who-can-approve.png"
surface = "ui"
caption = "Demo data: Mira's synthetic click records one approval; non-owner, mismatched-fingerprint, typed-reply, replay and late attempts are refused by real decision code."

[[tool.heinzel.catalog.screenshots]]
path = "docs/assets/screenshots/answers-cli.png"
surface = "cli"
caption = "Demo data: replaying the fictional clicks keeps one host approval reply; Mira's approval and the late request's expiry are already recorded."
