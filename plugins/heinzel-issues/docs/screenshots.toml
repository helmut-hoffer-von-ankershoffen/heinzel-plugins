format = 1
bootstrap = "docs/screenshot_fixture.py"
browser_time = "2026-11-08T10:00:00Z"

[[scenes]]
name = "issues-page"
surface = "ui"
route = "/?panel=issues:requests"
appearance = "light"
caption = "Three fictional reports: received, being worked on, and released in 0.9.27 — with a form to send another"

[[scenes.steps]]
action = "wait"
role = "list"
name = "Your reports and requests"

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "^Dismiss Doctor"
optional = true

[[scenes]]
name = "today-open-reports"
surface = "ui"
route = "/"
appearance = "dark"
caption = "Your open fictional reports and requests on Today, in dark mode; done ones leave the list"

[[scenes.steps]]
action = "wait"
text = "Your reports and requests"

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "^Dismiss Doctor"
optional = true

[[scenes]]
name = "cli-list"
surface = "cli"
caption = "The same fictional reports and their plain states through the real CLI"
command = ["issues", "list"]
