format = 1
bootstrap = "docs/screenshot_fixture.py"
browser_time = "2026-10-26T15:30:00Z"

[[scenes]]
name = "world-clock"
surface = "ui"
route = "/?panel=clock:world-clock"
appearance = "light"
caption = "Find overlap across Berlin, New York and Los Angeles with the World Clock — fictional demonstration time"
reduced_motion = "no-preference"

[[scenes.steps]]
action = "wait"
text = "Zones at work now"

[[scenes.steps]]
action = "wait"
text = "2/3"

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "^Dismiss Doctor"
optional = true

[[scenes.steps]]
action = "wait"
role = "region"
name = "World clock"

[[scenes.steps]]
action = "wait-webgl"

[[scenes]]
name = "team-overview"
surface = "ui"
route = "/"
appearance = "dark"
caption = "Fictional team working hours at a glance: the Today count and the primary footer clock"

[[scenes.steps]]
action = "wait"
text = "2/3"

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "^Dismiss Doctor"
optional = true

[[scenes.steps]]
action = "click"
role = "button"
name = "Close the chat"
within_role = "complementary"

[[scenes.steps]]
action = "hover"
role = "button"
name_regex = "^World clock: Berlin"

[[scenes.steps]]
action = "hover"
role = "button"
name_regex = "^Berlin"
within_role = "contentinfo"

# Core 0.9.40 keeps the Today heading screen-reader only; rest the pointer on the Today region instead.
[[scenes.steps]]
action = "hover"
role = "region"
name = "Today"

[[scenes]]
name = "footer-detail"
surface = "ui"
route = "/"
caption = "Inspect all configured time zones from the primary footer clock — fictional demonstration data"

[[scenes.steps]]
action = "wait"
text = "2/3"

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "^Dismiss Doctor"
optional = true

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "^Berlin"
within_role = "contentinfo"

[[scenes.steps]]
action = "wait"
text = "Ends in 1h 30m"

[scenes.focus]
role = "region"
name_regex = "^Berlin"

[[scenes]]
name = "phone-world-clock"
surface = "ui"
route = "/?panel=clock:world-clock"
caption = "The globe and three fictional team clocks on a phone — fixed demonstration time"
reduced_motion = "no-preference"

[[scenes.steps]]
action = "wait"
text = "2/3"

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "^Dismiss Doctor"
optional = true

[[scenes.steps]]
action = "wait"
role = "region"
name = "World clock"

[[scenes.steps]]
action = "wait-webgl"

[[scenes.steps]]
action = "hover"
role = "region"
name = "World clock"

[scenes.viewport]
width = 390
height = 844

# Terminal output is shown as CLI scenes; the in-app terminal view is not a feature view.
[[scenes]]
name = "terminal-current"
surface = "cli"
caption = "CLI: fictional demo team at 15:30 UTC: Berlin and New York are within working hours; Los Angeles starts in 30 minutes."
command = ["clock", "--at", "2026-10-26T15:30:00Z"]

[[scenes]]
name = "terminal-overlap"
surface = "cli"
caption = "CLI preview with --at: at 16:30 UTC all three fictional demo zones are within working hours."
command = ["clock", "--at", "2026-10-26T16:30:00Z"]

[[scenes]]
name = "cli-json"
surface = "cli"
caption = "Structured clock data for the fictional team at the fixed demonstration time."
command = ["clock", "--at", "2026-10-26T15:30:00Z", "--json"]
