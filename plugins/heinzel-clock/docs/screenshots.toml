format = 1
bootstrap = "docs/screenshot_fixture.py"
browser_time = "2026-10-26T15:30:00Z"

[[scenes]]
name = "world-clock"
surface = "ui"
route = "/?panel=clock:world-clock"
appearance = "light"
caption = "Find overlap across Berlin, New York and Los Angeles with the World Clock — fictional demonstration time"
reduced_motion = "no-preference"

[[scenes.steps]]
action = "wait"
text = "Zones at work now"

[[scenes.steps]]
action = "wait"
text = "2/3"

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "^Dismiss Doctor"
optional = true

[[scenes.steps]]
action = "wait"
role = "region"
name = "World clock"

[[scenes.steps]]
action = "wait-webgl"

[[scenes]]
name = "team-overview"
surface = "ui"
route = "/"
appearance = "dark"
caption = "Fictional team working hours at a glance: Today, sidebar ticker and primary footer clock"

[[scenes.steps]]
action = "wait"
text = "2/3"

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "^Dismiss Doctor"
optional = true

[[scenes.steps]]
action = "click"
role = "button"
name = "Close the chat"
within_role = "complementary"

[[scenes.steps]]
action = "hover"
role = "button"
name_regex = "^World clock: Berlin"

[[scenes.steps]]
action = "hover"
role = "button"
name_regex = "^Berlin"
within_role = "contentinfo"

[[scenes.steps]]
action = "hover"
role = "heading"
name = "Today"

[[scenes]]
name = "footer-detail"
surface = "ui"
route = "/"
caption = "Inspect all configured time zones from the primary footer clock — fictional demonstration data"

[[scenes.steps]]
action = "wait"
text = "2/3"

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "^Dismiss Doctor"
optional = true

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "^Berlin"
within_role = "contentinfo"

[[scenes.steps]]
action = "wait"
text = "Ends in 1h 30m"

[scenes.focus]
role = "region"
name_regex = "^Berlin"

[[scenes]]
name = "phone-world-clock"
surface = "ui"
route = "/?panel=clock:world-clock"
caption = "The globe and three fictional team clocks on a phone — fixed demonstration time"
reduced_motion = "no-preference"

[[scenes.steps]]
action = "wait"
text = "2/3"

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "^Dismiss Doctor"
optional = true

[[scenes.steps]]
action = "wait"
role = "region"
name = "World clock"

[[scenes.steps]]
action = "wait-webgl"

[[scenes.steps]]
action = "hover"
role = "region"
name = "World clock"

[scenes.viewport]
width = 390
height = 844

[[scenes]]
name = "cli-times"
surface = "cli"
caption = "The same fictional team zones and working hours in the CLI — fixed demonstration time"
command = ["clock", "--at", "2026-10-26T15:30:00Z"]

[[scenes]]
name = "terminal-current"
surface = "ui"
route = "/"
caption = "Fictional demo team at 15:30 UTC: Berlin and New York are working; Los Angeles starts in 30 minutes."
viewport = { width = 1280, height = 900 }
timeout_ms = 30000

[[scenes.steps]]
action = "wait"
text = "Zones at work now"

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "^Dismiss Doctor"
optional = true

[[scenes.steps]]
