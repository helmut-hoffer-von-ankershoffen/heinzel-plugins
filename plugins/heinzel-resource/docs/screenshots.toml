format = 1
bootstrap = "docs/screenshot_fixture.py"
browser_time = "2026-10-31T10:00:00Z"

[[scenes]]
name = "resources-pane"
surface = "ui"
route = "/"
appearance = "light"
caption = "CPU, memory and one-minute load with the core count in the expanded monitor — fictional demo workstation"

[[scenes.steps]]
action = "wait"
text = "Computer resources"

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "^Dismiss Doctor"
optional = true

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "CPU.*Memory.*Load"

[[scenes.steps]]
action = "wait"
text = "Host: demo-workstation"

[scenes.focus]
role = "region"
name_regex = "^Computer resources"

[[scenes]]
name = "today-resources"
surface = "ui"
route = "/"
appearance = "dark"
caption = "A quick CPU summary on Today, with three compact footer meters — demonstration values"

[[scenes.steps]]
action = "wait"
text = "CPU 36%"

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "^Dismiss Doctor"
optional = true

[[scenes]]
name = "phone-resources"
surface = "ui"
route = "/"
caption = "Read CPU, memory and one-minute load on a phone — fictional demo workstation"

[[scenes.steps]]
action = "wait"
text = "CPU 36%"

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "^Dismiss Doctor"
optional = true

[[scenes.steps]]
action = "click"
role = "button"
name = "More status items"
optional = true

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "CPU.*Memory.*Load"

[[scenes.steps]]
action = "wait"
text = "Host: demo-workstation"

[scenes.viewport]
width = 390
height = 844

[[scenes]]
name = "cli-resources"
surface = "cli"
caption = "Fictional CPU, memory, raw load and core count in the terminal"
command = ["resource"]

[[scenes]]
name = "cli-resources-json"
surface = "cli"
caption = "The fictional resource sample as JSON for automation"
command = ["resource", "--json"]
