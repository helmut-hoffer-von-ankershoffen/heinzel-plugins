format = 1
bootstrap = "docs/screenshot_fixture.py"
browser_time = "2026-10-31T10:00:00Z"

[[scenes]]
name = "resources-pane"
surface = "ui"
route = "/"
caption = "CPU, memory and scaled load in the expanded monitor — fictional demo workstation"

[[scenes.steps]]
action = "wait"
text = "Computer resources"

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "^Dismiss Doctor"
optional = true

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "CPU.*Memory.*Load"

[[scenes.steps]]
action = "wait"
text = "Host: demo-workstation"

[scenes.focus]
role = "region"
name_regex = "^Computer resources"

[[scenes]]
name = "today-resources"
surface = "ui"
route = "/"
caption = "A quick CPU summary on Today, with three compact footer meters — demonstration values"

[[scenes.steps]]
action = "wait"
text = "CPU 36%"

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "^Dismiss Doctor"
optional = true

[[scenes]]
name = "phone-resources"
surface = "ui"
route = "/"
caption = "Read CPU, memory and queued load on a phone — fictional demo workstation"

[[scenes.steps]]
action = "wait"
text = "CPU 36%"

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "^Dismiss Doctor"
optional = true

[[scenes.steps]]
action = "click"
role = "button"
name = "More status items"
optional = true

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "CPU.*Memory.*Load"

[[scenes.steps]]
action = "wait"
text = "Host: demo-workstation"

[scenes.viewport]
width = 390
height = 844

[[scenes]]
name = "cli-resources"
surface = "cli"
caption = "The same fictional CPU, memory and raw load measurements in the CLI"
command = ["resource"]

# Native-terminal cases for the plugin's single operation.
[[scenes]]
name = "terminal-resources"
surface = "ui"
route = "/"
caption = "Check CPU, memory, raw load and core count in the app terminal — fictional demo-workstation values"
viewport = { width = 1280, height = 900 }

[[scenes.steps]]
action = "terminal"
command = ["resource"]

[[scenes]]
name = "terminal-resources-json"
surface = "ui"
route = "/"
caption = "Inspect the structured resource sample for automation in the app terminal — fictional demo-workstation data"
viewport = { width = 1280, height = 900 }

[[scenes.steps]]
action = "terminal"
command = ["resource", "--json"]
