format = 1
bootstrap = "docs/screenshot_fixture.py"
browser_time = "2026-11-01T12:00:00Z"

# Core workflow views use the fixture's declared contract; no report has been generated.
[[scenes]]
name = "workflow-list"
surface = "ui"
route = "/contracts"
appearance = "light"
caption = "Demo data: the fictional Meeting notes workflow declares a need for meeting summaries."
timeout_ms = 30000

[[scenes.steps]]
action = "wait"
text = "Meeting notes"

[scenes.viewport]
width = 1280
height = 800

[[scenes]]
name = "workflow-context"
surface = "ui"
route = "/contracts/meeting-notes"
appearance = "dark"
caption = "Demo data: the fictional Meeting notes contract declares summary input and Markdown output; no report has been generated."
timeout_ms = 30000

[[scenes.steps]]
action = "wait"
role = "heading"
name = "Meeting notes"

[scenes.viewport]
width = 1280
height = 800

[[scenes]]
name = "summary-cli"
surface = "cli"
caption = "Demo data: the fixture requester shows Weekly sync's parsed recap, next steps and source link."
command = ["showcase", "one", "sync"]

[[scenes]]
name = "launch-cli"
surface = "cli"
caption = "Demo data: the fixture requester shows Launch review's rollout decision and named next steps."
command = ["showcase", "one", "launch"]

[[scenes]]
name = "meeting-list-json"
surface = "cli"
caption = "Demo data: fictional October meetings as JSON, with meeting metadata rather than verbatim transcripts."
command = ["showcase", "ended", "--json"]
