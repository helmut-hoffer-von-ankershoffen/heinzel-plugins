format = 1
bootstrap = "docs/screenshot_fixture.py"
browser_time = "2026-10-31T12:00:00Z"

[[scenes]]
name = "sharing-ready"
surface = "ui"
route = "/"
appearance = "dark"
caption = "Turn private sharing on; the switch reads On with Copy link and Open — fictional local Tailscale demo"
timeout_ms = 30000

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "^Dismiss Doctor"
optional = true

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "^Tailscale"
within_role = "contentinfo"

[[scenes.steps]]
action = "wait"
role = "region"
name = "Tailscale"

[[scenes.steps]]
action = "click"
role = "switch"
name = "Share over Tailscale"

[[scenes.steps]]
action = "wait"
role = "link"
name = "Open"

[scenes.focus]
role = "region"
name = "Tailscale"

[[scenes]]
name = "sharing-request-cli"
surface = "cli"
caption = "Then hz tailscale status --json: mapped to the web app port; the CLI cannot see the web listener, so it says apply-required — fictional demo"
command = ["tailscale", "status", "--json"]

[[scenes]]
name = "sharing-off"
surface = "ui"
route = "/"
appearance = "light"
caption = "Turn private sharing off explicitly — fictional local Tailscale demo"
timeout_ms = 30000

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "^Dismiss Doctor"
optional = true

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "^Tailscale"
within_role = "contentinfo"

[[scenes.steps]]
action = "wait"
role = "region"
name = "Tailscale"

[[scenes.steps]]
action = "click"
role = "switch"
name = "Share over Tailscale"

[[scenes.steps]]
action = "wait"
text = "Off"

[scenes.focus]
role = "region"
name = "Tailscale"

[[scenes]]
name = "sharing-off-cli"
surface = "cli"
caption = "Then hz tailscale status --json after switching off: not mapped; the target shows the default port 8737 — fictional local Tailscale demo"
command = ["tailscale", "status", "--json"]
