format = 1
bootstrap = "docs/screenshot_fixture.py"
browser_time = "2026-10-31T12:00:00Z"

[[scenes]]
name = "sharing-ready"
surface = "ui"
route = "/"
appearance = "dark"
caption = "Enable private sharing and see verified readiness — fictional local Tailscale demo"
timeout_ms = 30000

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "^Dismiss Doctor"
optional = true

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "^Tailscale"
within_role = "contentinfo"

[[scenes.steps]]
action = "wait"
role = "region"
name = "Tailscale"

[[scenes.steps]]
action = "click"
role = "switch"
name = "Share over Tailscale"

[[scenes.steps]]
action = "wait"
text = "Private sharing is ready for an authenticated browser."

[[scenes.steps]]
action = "wait"
role = "link"
name = "Open"

[scenes.focus]
role = "region"
name = "Tailscale"

[[scenes]]
name = "phone-sharing-ready"
surface = "ui"
route = "/"
caption = "Inspect the private link at phone width — fictional local Tailscale demo; no remote connection tested"
timeout_ms = 30000

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "^Dismiss Doctor"
optional = true

[[scenes.steps]]
action = "click"
role = "button"
name = "More status items"
optional = true

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "^Tailscale"

[[scenes.steps]]
action = "wait"
role = "region"
name = "Tailscale"

[[scenes.steps]]
action = "wait"
text = "Private sharing is ready for an authenticated browser."

[[scenes.steps]]
action = "wait"
role = "link"
name = "Open"

[scenes.viewport]
width = 390
height = 844

[[scenes]]
name = "sharing-request-cli"
surface = "cli"
caption = "Inspect the saved request and mapping with web verification pending — fictional local Tailscale demo"
command = ["tailscale", "status", "--json"]

[[scenes]]
name = "sharing-off"
surface = "ui"
route = "/"
appearance = "light"
caption = "Turn private sharing off explicitly — fictional local Tailscale demo"
timeout_ms = 30000

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "^Dismiss Doctor"
optional = true

[[scenes.steps]]
action = "click"
role = "button"
name_regex = "^Tailscale"
within_role = "contentinfo"

[[scenes.steps]]
action = "wait"
role = "region"
name = "Tailscale"

[[scenes.steps]]
action = "click"
role = "switch"
name = "Share over Tailscale"

[[scenes.steps]]
action = "wait"
text = "Private web sharing is off."

[scenes.focus]
role = "region"
name = "Tailscale"

[[scenes]]
name = "sharing-off-cli"
surface = "cli"
caption = "Inspect the request and mapping after switching off — fictional local Tailscale demo"
command = ["tailscale", "status", "--json"]
