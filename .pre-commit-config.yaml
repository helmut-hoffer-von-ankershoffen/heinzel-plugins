# Install with `make setup`. Hooks run tools from the project environment, so versions match uv.lock.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: debug-statements
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents] # pnpm-lock.yaml is several documents
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: gitleaks # credentials: API keys, tokens, private keys (confidential terms: scripts/check_confidentiality.py)
        name: gitleaks (credentials in the staged changes)
        # The binary pinned in scripts/tools.toml, the same one `make secrets` runs over the history in CI.
        entry: uv run --quiet --no-project --script scripts/tools.py run gitleaks git --pre-commit --staged --redact --verbose
        language: system
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run --group tooling ruff format
        language: system
        types: [python]
        exclude: ^plugins/
      - id: ruff-check
        name: ruff check
        entry: uv run --group tooling ruff check --fix
        language: system
        types: [python]
        exclude: ^plugins/
      - id: confidentiality
        name: confidential terms
        entry: uv run --no-project --script scripts/check_confidentiality.py
        language: system
      - id: confidentiality-identity
        name: confidential terms in the author and committer
        entry: uv run --no-project --script scripts/check_confidentiality.py --identity
        language: system
        pass_filenames: false
        always_run: true
      - id: confidentiality-branch
        name: confidential terms in the branch name
        entry: uv run --no-project --script scripts/check_confidentiality.py --branch
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: confidentiality-commit-msg
        name: confidential terms in the commit message
        entry: uv run --no-project --script scripts/check_confidentiality.py --commit-msg
        language: system
        stages: [commit-msg]
      - id: check-fast
        name: make check-fast (format, lint, contracts, generated files, unit tests)
        entry: bash -c 'test -f pyproject.toml || exit 0; exec make check-fast' # prek also runs this from template/, which has no project
        language: system
        pass_filenames: false
        exclude: ^plugins/
        stages: [pre-push]
      - id: owning-plugin-checks
        name: owning plugin lint and offline tests
        entry: uv run --frozen --group tooling hz-plugin check-changed --git-hook
        language: system
        pass_filenames: false
        always_run: true # Git supplies deleted paths as well as existing files; unrelated changes are a no-op.
        require_serial: true
        stages: [pre-commit, pre-push]
      - id: commitizen
        name: conventional commit message
        entry: uv run --group tooling cz check --commit-msg-file
        language: system
        stages: [commit-msg]
